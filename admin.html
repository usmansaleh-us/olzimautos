<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYD EV Admin</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f7fb}.admin{max-width:1200px;margin:auto;padding:30px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.admin-card{background:#fff;border:1px solid #e4e9ef;border-radius:14px;padding:20px}.admin-card small{display:block;color:#7b8794}.admin-card strong{display:block;font-size:28px;margin-top:6px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e4e9ef;border-radius:14px;margin-top:18px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:13px 14px;text-align:left;border-bottom:1px solid #edf0f4;font-size:12px}.table th{font-size:11px;color:#657383;background:#f9fafb}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf4ff}.login{max-width:430px;margin:80px auto}.hidden{display:none}@media(max-width:800px){.admin-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.admin{padding:15px}.admin-grid{grid-template-columns:1fr}}</style></head><body><div id="adminApp"></div><script src="api.js"></script><script>
const root=document.getElementById('adminApp');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function login(){root.innerHTML=`<div class="login"><div class="auth-card"><div class="brand" style="margin-bottom:25px"><span class="brand-mark"></span>BYD <small>EV</small></div><h1>Admin Portal</h1><p>Sign in to manage customers, appointments and enquiries.</p><div class="field"><label>Email</label><input id="ae" type="email" value="admin@bydev.demo"></div><div class="field"><label>Password</label><input id="ap" type="password" placeholder="Admin password"></div><button class="btn btn-primary full" onclick="adminLogin()">Sign In</button><p id="err" style="color:#b42318;font-size:11px"></p></div></div>`}
async function adminLogin(){try{const d=await bydApi('/auth/login',{method:'POST',body:JSON.stringify({email:ae.value,password:ap.value})});if(d.user.role!=='admin')throw Error('This account is not an administrator');localStorage.setItem('bydToken',d.token);localStorage.setItem('bydUser',JSON.stringify(d.user));load();}catch(e){document.getElementById('err').textContent=e.message}}
async function load(){if(!localStorage.getItem('bydToken'))return login();try{const [s,u,a,l]=await Promise.all([bydApi('/admin/stats'),bydApi('/admin/users'),bydApi('/admin/appointments'),bydApi('/admin/leads')]);root.innerHTML=`<div class="admin"><div class="admin-head"><div><div class="brand"><span class="brand-mark"></span>BYD <small>EV</small></div><h1>Admin Dashboard</h1><p>Customer portal operations</p></div><button class="btn btn-outline" onclick="logoutAdmin()">Logout</button></div><div class="admin-grid">${[['Customers',s.users],['Appointments',s.appointments],['Test Drives',s.testDrives],['Quotes',s.quotes],['Contacts',s.contacts],['Support Tickets',s.tickets],['Vehicles',s.vehicles]].map(x=>`<div class="admin-card"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Email</th><th>Membership</th><th>City</th><th>Joined</th></tr></thead><tbody>${u.users.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td><span class="pill">${esc(x.membership_plan)}</span></td><td>${esc(x.city)}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div><div class="table-wrap"><table class="table"><thead><tr><th>Appointment</th><th>Customer</th><th>Vehicle</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${a.appointments.map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(x.full_name)}</td><td>${esc(x.vehicle_name||'-')}</td><td>${esc(x.appointment_date)} ${esc(x.appointment_time)}</td><td>${esc(x.status)}</td><td><select onchange="status(${x.id},this.value)"><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></td></tr>`).join('')}</tbody></table></div><div class="table-wrap"><table class="table"><thead><tr><th>Type</th><th>Name</th><th>Email</th><th>Details</th><th>Status</th></tr></thead><tbody>${l.testDrives.map(x=>`<tr><td>Test Drive</td><td>${esc(x.full_name)}</td><td>${esc(x.user_email||'')}</td><td>${esc(x.model)} · ${esc(x.drive_date)} ${esc(x.drive_time)}</td><td>${esc(x.status)}</td></tr>`).join('')}${l.quotes.map(x=>`<tr><td>Quote</td><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc(x.model)} · ${esc(x.message)}</td><td>${esc(x.status)}</td></tr>`).join('')}${l.contacts.map(x=>`<tr><td>Contact</td><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.message)}</td><td>${esc(x.status)}</td></tr>`).join('')}${l.tickets.map(x=>`<tr><td>Support</td><td>${esc(x.full_name||'Customer')}</td><td>${esc(x.email||'')}</td><td>${esc(x.subject)} · ${esc(x.message)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){localStorage.removeItem('bydToken');login();}}
async function status(id,value){try{await bydApi('/admin/appointments/'+id,{method:'PATCH',body:JSON.stringify({status:value})});load()}catch(e){alert(e.message)}}function logoutAdmin(){localStorage.removeItem('bydToken');localStorage.removeItem('bydUser');login()}load();</script></body></html>
